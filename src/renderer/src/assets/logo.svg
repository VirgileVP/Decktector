<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Magnifying glass, neon cyan -->
  <g filter="url(#glow)" stroke="#22d3ee" stroke-width="3.5" fill="none" stroke-linecap="round">
    <circle cx="27" cy="27" r="17" />
    <line x1="40" y1="40" x2="54" y2="54" />
  </g>
  <!-- Waveform inside the lens, neon pink -->
  <g filter="url(#glow)" stroke="#f472b6" stroke-width="2.6" stroke-linecap="round">
    <line x1="17" y1="27" x2="17" y2="27.01" />
    <line x1="21" y1="22" x2="21" y2="32" />
    <line x1="25" y1="17" x2="25" y2="37" />
    <line x1="29" y1="21" x2="29" y2="33" />
    <line x1="33" y1="24" x2="33" y2="30" />
    <line x1="37" y1="26" x2="37" y2="28" />
  </g>
</svg>
