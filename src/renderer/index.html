<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Without this, mobile browsers assume a ~980px desktop layout and
         scale it down, so the remote view's responsive rules never fire. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decktector</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
