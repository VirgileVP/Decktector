[package]
name = "prolink"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pro DJ Link protocol client: virtual CDJ, device discovery, player status and metadata"

[dependencies]
anyhow = { workspace = true }
# Wall-clock stamps for `capture::append_note` — a session's notes are read
# back against a human's memory and a Wireshark timeline, both of which are
# in local time, which `std::time` alone can't produce.
chrono = { workspace = true }
# Only the `prolink-capture` binary resolves `--bind`'s default this way
# (already a workspace dependency — see `HARDWARE-CAPTURE-PLAN.md`).
if-addrs = { workspace = true }
serde = { workspace = true }
# Needed for the hardware capture tool's JSONL session logs
# (`crates/prolink/src/capture.rs`) — see `HARDWARE-CAPTURE-PLAN.md`.
serde_json = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
# `signal` on top of the workspace's tokio features is only needed by the
# `prolink-capture` binary, to wait for Ctrl+C at the end of a session.
# `process` is needed by `tests/capture_tool_e2e.rs` and by the
# `prolink-session` binary, both of which drive `prolink-capture`/`cdj-sim`
# as real child processes. `io-std` is what lets `prolink-capture` also stop
# on stdin EOF and `prolink-session` read the booth operator's ENTER.
tokio = { workspace = true, features = ["signal", "process", "io-std"] }
tracing = { workspace = true }
# Only the `prolink-capture` binary installs a subscriber (see its own doc
# comment) — the library itself just emits `tracing` events as before.
tracing-subscriber = "0.3"
ts-rs = { workspace = true }
# `rusqlite` is split across the two target blocks below rather than
# declared here: SQLCipher needs OpenSSL, and where that OpenSSL comes
# from has to differ per platform.
tempfile = "3"

# `getifaddrs` for the real hardware MAC of the booth adapter, which our
# keep-alive has to announce (see `crates/prolink/src/presence.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# SQLCipher, for the encrypted DeviceLibraryPlus databases Rekordbox 7 and
# the CDJ-3000 write (see `src/nfs/devicelibraryplus.rs`), links against
# OpenSSL. On macOS and Linux the system copy is there to link.
rusqlite = { version = "0.33", features = ["bundled-sqlcipher"] }

# The same hardware MAC on Windows, where `getifaddrs` doesn't exist:
# `GetAdaptersAddresses` is the supported way to walk adapters and their
# addresses. Announcing a synthetic MAC instead is not a cosmetic fallback —
# players address their status packets to the MAC from our keep-alive, so a
# made-up one means no status packets at all (see `presence::interface_mac`).
# `Ndis` is not used directly; `IP_ADAPTER_ADDRESSES_LH` is gated behind it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# The same SQLCipher as the Unix block, but vendoring OpenSSL instead of
# linking a system one. Windows has no system OpenSSL to link: the build
# machine's copy (the CI image ships one) is a DLL build, so linking it
# would leave the installer depending on a `libcrypto-3-x64.dll` that is
# never shipped with it — the app would install and then fail to start on
# a machine that has no OpenSSL. The vendored feature builds OpenSSL from
# source and links it statically, which needs NASM on the build machine
# (the `Build` workflow installs it).
[target.'cfg(windows)'.dependencies.rusqlite]
version = "0.33"
features = ["bundled-sqlcipher-vendored-openssl"]

[dev-dependencies]
# Only `tests/hardware_capture_replay.rs`'s `.EXT` replay needs these — same
# versions `prolink-engine` already builds against, reused here rather than
# re-pinned (see that crate's `Cargo.toml` for why `binrw` is needed
# alongside `rekordcrate`). `prolink-engine` itself can't be a dev
# -dependency here: it already depends on `prolink`, and Cargo rejects that
# cycle even for dev-only edges.
binrw = "0.14"
rekordcrate = { workspace = true }
