[package]
name = "prolink"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pro DJ Link protocol client: virtual CDJ, device discovery, player status and metadata"

[dependencies]
anyhow = { workspace = true }
# Only the `prolink-capture` binary resolves `--bind`'s default this way
# (already a workspace dependency — see `HARDWARE-CAPTURE-PLAN.md`).
if-addrs = { workspace = true }
serde = { workspace = true }
# Needed for the hardware capture tool's JSONL session logs
# (`crates/prolink/src/capture.rs`) — see `HARDWARE-CAPTURE-PLAN.md`.
serde_json = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
# `signal` on top of the workspace's tokio features is only needed by the
# `prolink-capture` binary, to wait for Ctrl+C at the end of a session.
# `process` is only needed by `tests/capture_tool_e2e.rs`, to drive
# `prolink-capture`/`cdj-sim` as real child processes.
tokio = { workspace = true, features = ["signal", "process"] }
tracing = { workspace = true }
# Only the `prolink-capture` binary installs a subscriber (see its own doc
# comment) — the library itself just emits `tracing` events as before.
tracing-subscriber = "0.3"
ts-rs = { workspace = true }

[dev-dependencies]
# Only `tests/hardware_capture_replay.rs`'s `.EXT` replay needs these — same
# versions `prolink-engine` already builds against, reused here rather than
# re-pinned (see that crate's `Cargo.toml` for why `binrw` is needed
# alongside `rekordcrate`). `prolink-engine` itself can't be a dev
# -dependency here: it already depends on `prolink`, and Cargo rejects that
# cycle even for dev-only edges.
binrw = "0.14"
rekordcrate = { workspace = true }
tempfile = "3"
