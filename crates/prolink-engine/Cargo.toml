[package]
name = "prolink-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Real Pro DJ Link engine: maps live network state onto decktector's domain model"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
# Only needed for the `BinRead` trait itself (`ANLZ::read(...)` is a trait
# method) — pinned to match whatever rekordcrate currently builds against.
binrw = "0.14"
decktector-core = { workspace = true }
decktector-net = { workspace = true }
prolink = { workspace = true }
rekordcrate = { workspace = true }
# Only the `sim-fixtures` binary needs these: it serialises the `TrackInfo`
# fixtures it builds, which the simulator reads back (see that file's doc
# comment).
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Paused clock for the analysis-retry schedule tests.
tokio = { workspace = true, features = ["test-util"] }
