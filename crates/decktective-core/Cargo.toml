[package]
name = "decktective-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Normalized deck model and engine layer for Decktective"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
# The simulation can run on tracks recorded from real hardware, read from a
# JSON fixture file (`sim::SimLibrary`).
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
# `start_paused` lets the timing-driven simulation tests run instantly.
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
