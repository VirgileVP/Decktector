[package]
name = "decktective-remote"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LAN web server that streams the engine's state to remote browsers"

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
decktective-core = { workspace = true }
decktective-net = { workspace = true }
futures-util = "0.3"
http-body-util = "0.1"
# Only used to proxy asset requests to the Vite dev server in development
# (see `assets::AssetSource::DevServer`); a packaged build serves files.
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = { workspace = true }
rcgen = "0.14"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["fs"] }
tracing = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
