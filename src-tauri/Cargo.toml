[package]
name = "decktector"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Real-time visualizer for Pioneer Pro DJ Link decks (CDJ/XDJ)"

[lib]
# The app lives in the library so it stays testable; the binary in
# src/main.rs is a thin wrapper around `run()`. Desktop-only, so none of the
# staticlib/cdylib targets the Tauri mobile templates carry are needed.
name = "decktector_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
decktector-core = { workspace = true }
decktector-remote = { workspace = true }
decktector-timecode = { workspace = true }
keepawake = "0.6"
prolink = { workspace = true }
prolink-engine = { workspace = true }
serde = { workspace = true }
tauri = { version = "2", features = ["macos-private-api"] }
# Native file dialogs for lineup import/export. Held on 2.7: 2.8 requires
# tauri 2.12, which would drift from the @tauri-apps/api and CLI versions in
# package.json.
tauri-plugin-dialog = "~2.7"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
