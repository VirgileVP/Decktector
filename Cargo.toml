[workspace]
resolver = "2"
members = [
    "crates/decktector-core",
    "crates/decktector-net",
    "crates/decktector-remote",
    "crates/decktector-timecode",
    "crates/prolink",
    "crates/prolink-engine",
    "crates/sim-audio",
    "src-tauri",
]

[workspace.package]
version = "1.5.0"
edition = "2021"
authors = ["Virgile Pornet"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
decktector-core = { path = "crates/decktector-core" }
decktector-net = { path = "crates/decktector-net" }
decktector-remote = { path = "crates/decktector-remote" }
decktector-timecode = { path = "crates/decktector-timecode" }
prolink = { path = "crates/prolink" }
prolink-engine = { path = "crates/prolink-engine" }

anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
cpal = "0.15"
# `link-local`: without it, Windows builds silently drop every 169.254.x.x
# address — the self-assigned range a DHCP-less Pro DJ Link network runs on,
# so the booth adapter would never be listed or auto-picked. Unplugged
# adapters' 169.254 addresses stay out: if-addrs skips non-"Preferred" ones.
if-addrs = { version = "0.13", features = ["link-local"] }
midir = "0.10"
rand = { version = "0.9", features = ["small_rng"] }
# `anlz` module only — its `pdb` module's row types are private in this
# published version, see crates/prolink/src/nfs/pdb.rs's doc comment for
# why this phase hand-rolls PDB parsing instead of depending on it there
# too. `default-features = false` drops the `cli` feature (pulls in clap
# for a binary this workspace doesn't use).
rekordcrate = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
# MP3 decoding + ID3 tags for the `sim-audio` fixture builder, pure Rust and
# used by that dev tool alone — never linked into the app itself.
symphonia = { version = "0.5", features = ["mp3"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tracing = "0.1"
ts-rs = "10"

[profile.release]
# A visualizer running next to a live set: prefer a small, fast binary and
# accept the longer build.
opt-level = 3
lto = true
codegen-units = 1
strip = true
