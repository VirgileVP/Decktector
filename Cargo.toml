[workspace]
resolver = "2"
members = [
    "crates/decktective-core",
    "crates/decktective-net",
    "crates/decktective-remote",
    "crates/decktective-timecode",
    "crates/prolink",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Virgile Pornet"]
license = "MIT"

[workspace.dependencies]
decktective-core = { path = "crates/decktective-core" }
decktective-net = { path = "crates/decktective-net" }
decktective-remote = { path = "crates/decktective-remote" }
decktective-timecode = { path = "crates/decktective-timecode" }
prolink = { path = "crates/prolink" }

anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
cpal = "0.15"
if-addrs = "0.13"
midir = "0.10"
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
ts-rs = "10"

[profile.release]
# A visualizer running next to a live set: prefer a small, fast binary and
# accept the longer build.
opt-level = 3
lto = true
codegen-units = 1
strip = true
