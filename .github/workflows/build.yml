name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux build needs the system webview and its GTK stack.
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      # Also regenerates the renderer's model types, so the typecheck below
      # fails if the Rust model and the committed bindings have drifted.
      - name: Rust tests
        run: npm run test:rust

      - name: Fail if the generated model types are stale
        run: git diff --exit-code src/renderer/src/model

      - name: Lint and typecheck
        run: |
          cargo fmt --all --check
          npm run lint:rust
          npm run typecheck
          npm run lint

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: decktective-macos
            bundle: target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            artifact: decktective-windows
            bundle: target/release/bundle/nsis/*-setup.exe
          - platform: ubuntu-latest
            artifact: decktective-linux
            bundle: target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
