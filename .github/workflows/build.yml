name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # A release tag must match the app's version and have its notes written in
      # CHANGELOG.md. Checked first, so a forgotten bump or missing notes fails in
      # seconds instead of after every platform has built.
      - name: Check the release version and notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$app_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $app_version"
            exit 1
          fi
          node scripts/release-notes.mjs "$version" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux build needs the system webview and its GTK stack, and
      # cpal needs the ALSA headers.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install dependencies
        run: npm ci

      # The app bundles `dist` as a Tauri resource, so its build script fails
      # until the renderer has been built once.
      - name: Build the renderer
        run: npm run build:renderer

      # Also regenerates the renderer's model types, so the typecheck below
      # fails if the Rust model and the committed bindings have drifted.
      - name: Rust tests
        run: npm run test:rust

      - name: Fail if the generated model types are stale
        run: git diff --exit-code src/renderer/src/model

      - name: Lint and typecheck
        run: |
          cargo fmt --all --check
          npm run lint:rust
          npm run typecheck
          npm run lint

  build:
    needs: check
    permissions:
      # The installers go out as release assets rather than Actions
      # artifacts (see the publish step) — creating and uploading to a
      # release is what needs write access here.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle: target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            bundle: target/release/bundle/nsis/*-setup.exe
          # The AppImage carries the build system's libraries, linked against its
          # glibc, so it only starts where glibc is at least as new (issue #3). It is
          # built in an Ubuntu 22.04 container rather than on the hosted runner, whose
          # Ubuntu keeps moving forward and whose older images get retired.
          # `max-glibc` is the oldest glibc the AppImage supports, 22.04's, checked
          # after the build: raise it only to drop those distributions on purpose.
          - platform: ubuntu-latest
            container: ubuntu:22.04
            bundle: target/release/bundle/appimage/*.AppImage
            max-glibc: '2.35'

    runs-on: ${{ matrix.platform }}
    # Empty on macOS and Windows, where the job runs on the runner itself.
    container: ${{ matrix.container }}
    steps:
      # The container starts from a bare Ubuntu, run as root without sudo. On top
      # of the app's own needs (webview, GTK, ALSA, OpenSSL for SQLCipher) it gets
      # what the hosted runner would have provided: git, so the checkout is a real
      # repository, curl for rustup, a C toolchain with CMake for aws-lc-sys, and
      # xdg-utils, whose `xdg-open` Tauri copies into the AppImage.
      - name: Install the build container's system dependencies
        if: matrix.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            build-essential ca-certificates cmake curl file git pkg-config xdg-utils \
            libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev

      # The publish step uploads with `gh`, which a bare Ubuntu lacks. Installed
      # from the GitHub CLI's own apt repository, as its documentation describes.
      - name: Install the GitHub CLI in the build container
        if: matrix.container
        run: |
          keyring=/etc/apt/keyrings/githubcli-archive-keyring.gpg
          mkdir -p -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o "$keyring"
          chmod go+r "$keyring"
          echo "deb [arch=$(dpkg --print-architecture) signed-by=$keyring] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y gh

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # rust-cache tells runners apart by OS only. Keyed on the container too, so
      # dependencies built against a newer Ubuntu's glibc are never restored into
      # the 22.04 build, where they would fail to link or run.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.container }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Refuses to publish an AppImage that would not start on the oldest
      # distribution it targets, as happened in issue #3.
      - name: Check the AppImage's glibc requirement
        if: matrix.max-glibc
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(${{ matrix.bundle }})
          if [[ ${#appimages[@]} -eq 0 ]]; then
            echo "::error::no AppImage matched ${{ matrix.bundle }}"
            exit 1
          fi
          for appimage in "${appimages[@]}"; do
            node scripts/appimage-glibc-check.mjs "$appimage" "${{ matrix.max-glibc }}"
          done

      # Release assets rather than `actions/upload-artifact`: on a private
      # repository Actions artifacts share a 500 MB quota that three
      # platforms' installers fill in a handful of builds, and once it is
      # full *every* upload fails with "Artifact storage quota has been
      # hit" — which is what silently broke every build here from
      # 2026-09-08 on, long after the code itself was fine. Release
      # storage is not part of that quota.
      #
      # A `v*` tag publishes under that tag; any other build gets a
      # prerelease named after its commit, so a branch build stays
      # downloadable without pretending to be a release.
      - name: Publish the installer to a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Named outright so `gh` does not depend on the checkout's git config,
          # which git may not trust inside the container, where root does not own
          # the workspace.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # An unmatched glob would otherwise reach `gh` as a literal
          # pattern and fail there with a confusing message; this is the
          # `if-no-files-found: error` this step replaces.
          shopt -s nullglob
          installers=(${{ matrix.bundle }})
          if [[ ${#installers[@]} -eq 0 ]]; then
            echo "::error::no installer matched ${{ matrix.bundle }}"
            exit 1
          fi

          # A `v*` tag is a real release: titled after the app, with its
          # CHANGELOG.md section as the notes (the check job has already
          # made sure there is one). Anything else is a bare build.
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            product="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
            title="$product $tag"
            node scripts/release-notes.mjs "${tag#v}" > "$notes"
          else
            tag="build-${GITHUB_SHA::7}"
            title="$tag"
            echo "Automated build of \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`." > "$notes"
          fi

          # The three platform jobs run in parallel and share one release,
          # so whichever loses the race to create it must carry on rather
          # than fail — hence the view/create/view sequence. The notes are
          # only set here, so a re-run keeps any edit made on GitHub since.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            create=(--target "$GITHUB_SHA" --title "$title" --notes-file "$notes")
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              create+=(--prerelease)
            fi
            gh release create "$tag" "${create[@]}" || gh release view "$tag" >/dev/null
          fi

          # `--clobber` so re-running a build replaces its own assets
          # instead of erroring on the name already being there.
          gh release upload "$tag" "${installers[@]}" --clobber
